<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760">
  <style>
    text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#243447}.title{font-size:28px;font-weight:700}.label{font-size:19px;font-weight:700}.small{font-size:16px}
    .box{fill:#eaf3f7;stroke:#315b78;stroke-width:2;rx:14}.decision{fill:#fff1df;stroke:#b2783c;stroke-width:2}.good{fill:#e9f1e8;stroke:#47734b;stroke-width:2}.arrow{stroke:#5a7184;stroke-width:3;fill:none;marker-end:url(#m)}
  </style>
  <defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#5a7184"/></marker></defs>
  <text x="500" y="42" text-anchor="middle" class="title">地点提交与审核流程</text>
  <rect x="350" y="75" width="300" height="68" class="box"/><text x="500" y="117" text-anchor="middle" class="label">用户填写地点信息</text>
  <path d="M500 143 V180" class="arrow"/>
  <rect x="350" y="180" width="300" height="68" class="box"/><text x="500" y="222" text-anchor="middle" class="label">图片检查与上传</text>
  <path d="M500 248 V285" class="arrow"/>
  <rect x="350" y="285" width="300" height="68" class="box"/><text x="500" y="327" text-anchor="middle" class="label">重复地点检查</text>
  <path d="M500 353 V390" class="arrow"/>
  <rect x="300" y="390" width="400" height="82" class="decision"/><text x="500" y="425" text-anchor="middle" class="label">高德地点核验是否匹配</text><text x="500" y="452" text-anchor="middle" class="small">名称、地址和坐标</text>
  <path d="M300 431 H190 V535" class="arrow"/><text x="235" y="417" class="small">否</text>
  <rect x="40" y="535" width="300" height="70" class="box"/><text x="190" y="578" text-anchor="middle" class="label">进入后台人工审核</text>
  <path d="M700 431 H810 V535" class="arrow"/><text x="745" y="417" class="small">是</text>
  <rect x="660" y="535" width="300" height="70" class="good"/><text x="810" y="578" text-anchor="middle" class="label">自动上线并展示</text>
  <path d="M190 605 V635 H500 V670" class="arrow"/><path d="M810 605 V635 H500 V670" class="arrow"/>
  <rect x="350" y="670" width="300" height="68" class="good"/><text x="500" y="712" text-anchor="middle" class="label">社区浏览、评价和导航</text>
</svg>
