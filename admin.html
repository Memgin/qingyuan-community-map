<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>清远地图 · 内容审核</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { padding: 30px; } .admin-shell { max-width: 980px; margin: auto; } .admin-head { display: flex; justify-content: space-between; align-items: end; margin-bottom: 24px; } .admin-head h1 { margin: 0; font-family: "Noto Serif SC", serif; } .token-row { display: flex; gap: 10px; margin-bottom: 20px; } .token-row input { max-width: 360px; margin: 0; } .admin-card { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; border: 1px solid var(--line); padding: 18px; margin-bottom: 10px; background: var(--panel); } .admin-card h2 { margin: 0 0 6px; font-family: "Noto Serif SC", serif; font-size: 18px; } .admin-card p { margin: 0; color: var(--muted); font-size: 12px; } .admin-actions { display: flex; gap: 8px; } .admin-actions button { border: 0; padding: 10px 13px; color: white; font-size: 11px; font-weight: 700; } .approve { background: var(--green); } .reject { background: var(--coral); } #adminMessage { color: var(--green); font-size: 12px; }
  </style>
</head>
<body>
  <main class="admin-shell">
    <header class="admin-head"><div><p class="eyebrow">ADMIN / MODERATION</p><h1>地点审核</h1></div><a class="text-button" href="./">返回地图 →</a></header>
    <div class="token-row"><input id="adminToken" type="password" placeholder="输入 ADMIN_TOKEN"><button class="primary-button" id="loadButton" type="button">加载待审核</button></div>
    <p id="adminMessage" role="status"></p><section id="pendingList"></section><h2>待处理举报</h2><section id="reportList"></section>
  </main>
  <script src="admin.js?v=20260904-2"></script>
</body>
</html>
